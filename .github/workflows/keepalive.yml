# Render's free tier sleeps after 15 idle minutes. Ping the hosted dashboard so judges never hit a cold start.
# Set the repository variable STREAMLINE_URL (e.g. https://streamline-xxxx.onrender.com) to enable.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    if: vars.STREAMLINE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.STREAMLINE_URL }}/healthz"
